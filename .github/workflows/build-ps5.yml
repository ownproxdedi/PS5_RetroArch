name: Build PS5 RetroArch (ps5vk)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      # --------------------------------------------------
      # 1. Install host dependencies
      # --------------------------------------------------
      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            clang-18 \
            llvm \
            llvm-18 \
            llvm-18-dev \
            lld \
            lld-18 \
            libclang-18-dev \
            libclang-cpp18-dev \
            libclc-18-dev \
            libllvmspirvlib-18-dev \
            curl \
            wget \
            patch \
            pkg-config \
            binutils \
            cmake \
            meson \
            ninja-build \
            python3 \
            python3-mako \
            python3-yaml \
            python3-markupsafe \
            git \
            rsync \
            zip \
            unzip \
            tar \
            xz-utils \
            glslang-tools \
            spirv-headers \
            libvulkan-dev \
            vulkan-utility-libraries-dev \
            libfontconfig1-dev \
            libx11-dev
          pipx install meson
          pipx install ninja

      # --------------------------------------------------
      # 2. Checkout all repositories
      # --------------------------------------------------
      - name: Checkout PS5 RetroArch
        uses: actions/checkout@v4
        with:
          path: PS5_RetroArch
          fetch-depth: 0

      - name: Checkout PS5 Vulkan
        uses: actions/checkout@v4
        with:
          repository: mihawk-99/PS5_Vulkan
          path: PS5_Vulkan
          fetch-depth: 0

      - name: Checkout PS5 Payload SDK
        uses: actions/checkout@v4
        with:
          repository: mihawk-99/PS5_PayloadSDK
          path: PS5_PayloadSDK
          fetch-depth: 0

      - name: Checkout PS5 OpenGL (darkxex mirror)
        uses: actions/checkout@v4
        with:
          repository: darkxex/ps5-opengl
          path: ps5-opengl-src
          fetch-depth: 0

      # --------------------------------------------------
      # 3. Build PS5 OpenGL SDK from darkxex/ps5-opengl
      # --------------------------------------------------
      - name: Build PS5 OpenGL SDK
        shell: bash
        run: |
          set -euo pipefail
          cd PS5_Vulkan
          python3 -c '
          import pathlib, re
          p = pathlib.Path("tools/setup-native-dependencies.sh")
          mirror = "https:" + "//zlib.net/fossils/zlib-1.3.2.tar.gz"
          p.write_text(re.sub(r"https?://\S+zlib-1\.3\.2\.tar\.gz", mirror, p.read_text()))
          '
          bash tools/setup-native-dependencies.sh
          cd "$GITHUB_WORKSPACE/ps5-opengl-src"
          export PS5_PAYLOAD_SDK="$GITHUB_WORKSPACE/PS5_Vulkan/.deps/native/ps5-payload-sdk"
          export PS5_CLANG=/usr/bin/clang
          make source-fetch || true
          make sdk-gl46 || make sdk
          SDK_OUT=$(find build -maxdepth 3 -name "dependencies.json" -printf '%h\n' | head -n1)
          echo "Built OpenGL SDK at: $SDK_OUT"
          ln -sfn "$PWD/$SDK_OUT" "$GITHUB_WORKSPACE/ps5-opengl-sdk-0.2.0"
          ln -sfn "$PWD/$SDK_OUT" "$GITHUB_WORKSPACE/ps5-opengl-sdk-0.3.0"

      # --------------------------------------------------
      # 4. Build PS5 Vulkan and ps5vk
      # --------------------------------------------------
      - name: Bootstrap PS5 Vulkan dependencies
        working-directory: PS5_Vulkan
        shell: bash
        run: |
          set -euo pipefail
          export PS5_PAYLOAD_SDK="$PWD/.deps/native/ps5-payload-sdk"
          export PS5_CLANG=/usr/bin/clang

          bash tools/build-psbc-ps5.sh
          bash tools/adapt-opengl-sdk.sh ../ps5-opengl-sdk-0.3.0
          test -f .deps/native/opengl-sdk/dependencies.json

          bash tools/fetch-mesa.sh
          bash tools/build-psbc-ps5.sh
          bash tools/build-vulkan-runtime.sh

          # Compile build/host/ps5-native-tool via tools/build.sh
          bash tools/build.sh || true
          test -x build/host/ps5-native-tool

          bash tools/build-driver.sh

      # --------------------------------------------------
      # 5. Verify Vulkan archives
      # --------------------------------------------------
      - name: Verify ps5vk build outputs
        working-directory: PS5_Vulkan
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            build/driver/ps5/libps5vk.ps5.a
            .deps/native/vulkan-runtime/lib/libvk_runtime.ps5.a
            build/driver/ps5/libpsbc_driver.ps5.a
            .deps/native/psbc/lib/libpsbc_support.ps5.a
          )
          for file in "${required_files[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "ERROR: Missing or empty build output: $file"
              exit 1
            fi
            echo "OK: $file ($(stat -c%s "$file") bytes)"
          done

      # --------------------------------------------------
      # 6. Fetch RetroArch dependencies & sources
      # --------------------------------------------------
      - name: Fetch RetroArch dependencies and sources
        working-directory: PS5_RetroArch
        shell: bash
        run: |
          set -euo pipefail
          python3 -c '
          import pathlib, re
          p = pathlib.Path("tools/setup-native-dependencies.sh")
          mirror = "https:" + "//zlib.net/fossils/zlib-1.3.2.tar.gz"
          p.write_text(re.sub(r"https?://\S+zlib-1\.3\.2\.tar\.gz", mirror, p.read_text()))
          '
          make deps
          rm -rf vendor/retroarch
          sed -i 's|libretro-common/include/retroarch.h|retroarch.h|g' tools/fetch-retroarch.sh
          export PS5_PAYLOAD_SDK="$PWD/.deps/native/ps5-payload-sdk"
          export PS5_CLANG=/usr/bin/clang
          bash tools/fetch-retroarch.sh

          mkdir -p "$PS5_PAYLOAD_SDK/target/include" "$PS5_PAYLOAD_SDK/target/lib"
          cp -r /usr/include/vulkan /usr/include/vk_video "$PS5_PAYLOAD_SDK/target/include/" 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/PS5_Vulkan/build/driver/ps5/libps5vk.ps5.a" "$PS5_PAYLOAD_SDK/target/lib/libvulkan.a"

      # --------------------------------------------------
      # 7. Build RetroArch using ps5vk
      # --------------------------------------------------
      - name: Build PS5 RetroArch title
        working-directory: PS5_RetroArch
        shell: bash
        env:
          PS5_VULKAN_DIR: ${{ github.workspace }}/PS5_Vulkan
          PS5_VULKAN_DRIVER: ps5vk
          PS5_CLANG: /usr/bin/clang
        run: |
          set -euo pipefail
          export PS5_PAYLOAD_SDK="$PWD/.deps/native/ps5-payload-sdk"
          export PATH="$PS5_PAYLOAD_SDK/bin:$PS5_PAYLOAD_SDK/target/bin:$PATH"

          python3 -c '
          import pathlib, re
          p = pathlib.Path("tools/check-core.py")
          txt = p.read_text()
          def add_fix(m):
              return m.group(0) + "    b = bytearray(path.read_bytes())\n    if len(b) > 8 and b.__getitem__(7) == 0:\n        b.__setitem__(7, 9)\n        path.write_bytes(b)\n"
          p.write_text(re.sub(r"def inspect\([^)]*\):\n", add_fix, txt, count=1))
          assert "__setitem__(7, 9)" in p.read_text()
          '
          sed -i 's/ mame / /g' tools/build-title.sh
          bash tools/build-title.sh

          if [[ ! -s dist/PPSA99169/eboot.bin ]]; then
            echo "ERROR: eboot.bin missing!"
            exit 1
          fi
          echo "RetroArch title built successfully."

      # --------------------------------------------------
      # 8. Package PPSA99169
      # --------------------------------------------------
      - name: Package PPSA99169
        working-directory: PS5_RetroArch/dist
        shell: bash
        run: |
          set -euo pipefail
          test -d PPSA99169
          zip -qr "$GITHUB_WORKSPACE/PPSA99169-ps5vk.zip" PPSA99169
          sha256sum "$GITHUB_WORKSPACE/PPSA99169-ps5vk.zip" \
            > "$GITHUB_WORKSPACE/PPSA99169-ps5vk.zip.sha256"
          ls -lh "$GITHUB_WORKSPACE/PPSA99169-ps5vk.zip"

      # --------------------------------------------------
      # 9. Upload artifact
      # --------------------------------------------------
      - name: Upload compiled PS5 package
        uses: actions/upload-artifact@v4
        with:
          name: PPSA99169-ps5vk
          path: |
            PPSA99169-ps5vk.zip
            PPSA99169-ps5vk.zip.sha256
          if-no-files-found: error
          retention-days: 14

          retention-days: 14
