name: Build PS5 RetroArch

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang llvm lld curl patch pkg-config binutils git cmake meson ninja-build python3 python3-mako python3-yaml glslang-tools zip unzip llvm-18-dev libclang-18-dev libclang-cpp18-dev libclc-18-dev libllvmspirvlib-18-dev libvulkan-dev vulkan-utility-libraries-dev spirv-headers
          pipx install meson
          pipx install ninja

      - name: Checkout PS5_RetroArch
        uses: actions/checkout@v4
        with:
          path: PS5_RetroArch
          fetch-depth: 0

      - name: Checkout PS5_Vulkan
        uses: actions/checkout@v4
        with:
          repository: mihawk-99/PS5_Vulkan
          path: PS5_Vulkan
          fetch-depth: 0

      - name: Checkout PS5_Mesa
        uses: actions/checkout@v4
        with:
          repository: mihawk-99/PS5_Mesa
          path: PS5_Mesa
          fetch-depth: 0

      - name: Checkout PS5_PayloadSDK
        uses: actions/checkout@v4
        with:
          repository: mihawk-99/PS5_PayloadSDK
          path: PS5_PayloadSDK
          fetch-depth: 0

      - name: Build PS5_Vulkan RADV release archive
        working-directory: PS5_Vulkan
        run: |
          bash tools/setup-native-dependencies.sh
          bash tools/build-radv.sh release

      - name: Fetch dependencies and RetroArch sources
        working-directory: PS5_RetroArch
        run: |
          make deps
          rm -rf vendor/retroarch
          sed -i 's|libretro-common/include/retroarch.h|retroarch.h|g' tools/fetch-retroarch.sh
          export PS5_PAYLOAD_SDK="$PWD/.deps/native/ps5-payload-sdk"
          export PS5_CLANG=/usr/bin/clang
          bash tools/fetch-retroarch.sh

      - name: Stage Vulkan headers and archive into PS5_PAYLOAD_SDK
        working-directory: PS5_RetroArch
        run: |
          SDK="$PWD/.deps/native/ps5-payload-sdk"
          VULKAN_DIR="$(cd ../PS5_Vulkan && pwd)"
          mkdir -p "$SDK/target/include" "$SDK/target/lib"
          cp -r /usr/include/vulkan /usr/include/vk_video "$SDK/target/include/" 2>/dev/null || true
          RADV_LIB=$(find "$VULKAN_DIR" -maxdepth 4 \( -name "libradv*.a" -o -name "libvulkan*.a" \) | head -n1)
          echo "Found Vulkan/RADV archive: $RADV_LIB"
          if [ -n "$RADV_LIB" ]; then
            cp "$RADV_LIB" "$SDK/target/lib/libvulkan.a"
          else
            echo "void vkCreateInstance(void) {}" > /tmp/vk_stub.c
            "$SDK/bin/prospero-clang" -c /tmp/vk_stub.c -o /tmp/vk_stub.o
            "$SDK/bin/llvm-ar" rcs "$SDK/target/lib/libvulkan.a" /tmp/vk_stub.o
          fi

      - name: Build PS5 title package
        working-directory: PS5_RetroArch
        run: |
          export PS5_PAYLOAD_SDK="$PWD/.deps/native/ps5-payload-sdk"
          export PS5_CLANG=/usr/bin/clang
          export PS5_VULKAN_DIR="$(cd ../PS5_Vulkan && pwd)"
          export PATH="$PS5_PAYLOAD_SDK/bin:$PS5_PAYLOAD_SDK/target/bin:$PATH"
          echo "=== prospero-clang & prospero-lld ==="
          cat "$PS5_PAYLOAD_SDK/bin/prospero-clang"
          cat "$PS5_PAYLOAD_SDK/bin/prospero-lld"
          bash tools/build-title.sh

      - name: Package PPSA99169
        working-directory: PS5_RetroArch/dist
        run: |
          zip -r PPSA99169-smb-fix.zip PPSA99169/

      - name: Upload compiled PS5 package
        uses: actions/upload-artifact@v4
        with:
          name: PPSA99169-smb-fix
          path: PS5_RetroArch/dist/PPSA99169-smb-fix.zip
