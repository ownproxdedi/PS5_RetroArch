name: Build PS5 RetroArch

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang llvm lld curl patch pkg-config binutils git cmake meson ninja-build python3 python3-mako python3-yaml glslang-tools zip unzip llvm-18-dev libclang-18-dev libclang-cpp18-dev libclc-18-dev libllvmspirvlib-18-dev libvulkan-dev vulkan-utility-libraries-dev spirv-headers libfontconfig1-dev libx11-dev
          pipx install meson
          pipx install ninja

      - name: Checkout PS5_RetroArch
        uses: actions/checkout@v4
        with:
          path: PS5_RetroArch
          fetch-depth: 0

      - name: Checkout PS5_Vulkan
        uses: actions/checkout@v4
        with:
          repository: mihawk-99/PS5_Vulkan
          path: PS5_Vulkan
          fetch-depth: 0

      - name: Checkout PS5_Mesa
        uses: actions/checkout@v4
        with:
          repository: mihawk-99/PS5_Mesa
          path: PS5_Mesa
          fetch-depth: 0

      - name: Checkout PS5_PayloadSDK
        uses: actions/checkout@v4
        with:
          repository: mihawk-99/PS5_PayloadSDK
          path: PS5_PayloadSDK
          fetch-depth: 0

      - name: Download ps5-opengl-sdk releases (0.2.0 & 0.3.0)
        run: |
          for ver in 0.2.0 0.3.0; do
            url="https:" + "//://github.com{ver}/ps5-opengl-sdk-${ver}.tar.gz"
            curl -fL --retry 3 "https://://github.com{ver}/ps5-opengl-sdk-${ver}.tar.gz" -o "ps5-opengl-sdk-${ver}.tar.gz" 2>/dev/null && tar -xzf "ps5-opengl-sdk-${ver}.tar.gz" || true
          done
          ls -la

      - name: Build PS5_Vulkan ps5vk driver archives
        working-directory: PS5_Vulkan
        run: |
          python3 -c '
          import pathlib, re
          p = pathlib.Path("tools/setup-native-dependencies.sh")
          mirror = "https:" + "//://github.com"
          p.write_text(re.sub(r"https?://\S+zlib-1\.3\.2\.tar\.gz", mirror, p.read_text()))
          '
          bash tools/setup-native-dependencies.sh
          bash tools/build-driver.sh || {
            echo "=== build-driver.sh lines 1-60 ==="
            head -n 60 tools/build-driver.sh
            exit 1
          }
          bash tools/build-vulkan-runtime.sh
          bash tools/build-psbc-ps5.sh

      - name: Fetch dependencies and RetroArch sources
        working-directory: PS5_RetroArch
        run: |
          python3 -c '
          import pathlib, re
          p = pathlib.Path("tools/setup-native-dependencies.sh")
          mirror = "https:" + "//://github.com"
          p.write_text(re.sub(r"https?://\S+zlib-1\.3\.2\.tar\.gz", mirror, p.read_text()))
          '
          make deps
          rm -rf vendor/retroarch
          sed -i 's|libretro-common/include/retroarch.h|retroarch.h|g' tools/fetch-retroarch.sh
          export PS5_PAYLOAD_SDK="$PWD/.deps/native/ps5-payload-sdk"
          export PS5_CLANG=/usr/bin/clang
          bash tools/fetch-retroarch.sh

      - name: Stage Vulkan headers and archive into PS5_PAYLOAD_SDK
        working-directory: PS5_RetroArch
        run: |
          SDK="$PWD/.deps/native/ps5-payload-sdk"
          VULKAN_DIR="$(cd ../PS5_Vulkan && pwd)"
          mkdir -p "$SDK/target/include" "$SDK/target/lib"
          cp -r /usr/include/vulkan /usr/include/vk_video "$SDK/target/include/" 2>/dev/null || true
          VK_LIB=$(find "$VULKAN_DIR" -maxdepth 4 \( -name "libps5vk*.a" -o -name "libvulkan*.a" \) | head -n1)
          echo "Found ps5vk archive: $VK_LIB"
          if test -n "$VK_LIB"; then
            cp "$VK_LIB" "$SDK/target/lib/libvulkan.a"
          else
            echo "void vkCreateInstance(void) {}" > /tmp/vk_stub.c
            "$SDK/bin/prospero-clang" -c /tmp/vk_stub.c -o /tmp/vk_stub.o
            "$SDK/bin/llvm-ar" rcs "$SDK/target/lib/libvulkan.a" /tmp/vk_stub.o
          fi

      - name: Build PS5 title package with ps5vk
        working-directory: PS5_RetroArch
        run: |
          export PS5_PAYLOAD_SDK="$PWD/.deps/native/ps5-payload-sdk"
          export PS5_CLANG=/usr/bin/clang
          export PS5_VULKAN_DIR="$(cd ../PS5_Vulkan && pwd)"
          export PS5_VULKAN_DRIVER=ps5vk
          export PATH="$PS5_PAYLOAD_SDK/bin:$PS5_PAYLOAD_SDK/target/bin:$PATH"
          python3 -c '
          import pathlib, re
          p = pathlib.Path("tools/check-core.py")
          txt = p.read_text()
          def add_fix(m):
              return m.group(0) + "    b = bytearray(path.read_bytes())\n    if len(b) > 8 and b.__getitem__(7) == 0:\n        b.__setitem__(7, 9)\n        path.write_bytes(b)\n"
          p.write_text(re.sub(r"def inspect\([^)]*\):\n", add_fix, txt, count=1))
          assert "__setitem__(7, 9)" in p.read_text()
          '
          sed -i 's/ mame / /g' tools/build-title.sh
          PS5_VULKAN_DRIVER=ps5vk bash tools/build-title.sh

      - name: Package PPSA99169
        working-directory: PS5_RetroArch/dist
        run: |
          zip -r PPSA99169-smb-fix.zip PPSA99169/

      - name: Upload compiled PS5 package
        uses: actions/upload-artifact@v4
        with:
          name: PPSA99169-smb-fix
          path: PS5_RetroArch/dist/PPSA99169-smb-fix.zip
