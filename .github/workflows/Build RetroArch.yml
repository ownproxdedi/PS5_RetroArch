
name: Build PS5 RetroArch (ps5vk + MihawkGen - Fast)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:

      # --------------------------------------------------
      # 1. Install host build dependencies
      # --------------------------------------------------

      - name: Install host build dependencies
        shell: bash
        run: |
          set -euo pipefail

          APT_OPTIONS=(
            -o Acquire::Retries=5
            -o Acquire::http::Timeout=60
            -o Acquire::https::Timeout=60
            -o Acquire::http::No-Cache=true
          )

          sudo apt-get "${APT_OPTIONS[@]}" update

          for attempt in 1 2 3 4 5; do
            if sudo apt-get "${APT_OPTIONS[@]}" install -y \
              build-essential \
              clang clang-18 \
              llvm llvm-18 llvm-18-dev \
              lld lld-18 \
              libclang-18-dev libclang-cpp18-dev \
              libclc-18-dev libllvmspirvlib-18-dev \
              curl wget patch pkg-config binutils \
              cmake meson ninja-build \
              python3 python3-pip python3-pil \
              python3-mako python3-yaml python3-markupsafe \
              python3-lxml \
              git rsync zip unzip tar xz-utils \
              glslang-tools spirv-headers \
              libvulkan-dev vulkan-utility-libraries-dev \
              libfontconfig1-dev libx11-dev gh; then

              echo "Dependencies installed successfully."
              break
            fi

            if [[ "$attempt" -eq 5 ]]; then
              echo "::error::Dependency installation failed."
              exit 1
            fi

            echo "APT failed. Retrying..."
            sleep 20
            sudo apt-get "${APT_OPTIONS[@]}" update || true
          done

      # --------------------------------------------------
      # 2. Checkout repositories
      # --------------------------------------------------

      - name: Checkout PS5 RetroArch
        uses: actions/checkout@v4
        with:
          path: PS5_RetroArch
          fetch-depth: 0

      - name: Checkout PS5 Vulkan
        uses: actions/checkout@v4
        with:
          repository: mihawk-99/PS5_Vulkan
          path: PS5_Vulkan
          fetch-depth: 0

      - name: Checkout PS5 Mesa
        uses: actions/checkout@v4
        with:
          repository: mihawk-99/PS5_Mesa
          path: PS5_Mesa
          fetch-depth: 0

      - name: Checkout PS5 MihawkGen
        uses: actions/checkout@v4
        with:
          repository: mihawk-99/PS5_MihawkGen
          path: PS5_MihawkGen
          fetch-depth: 0

      - name: Checkout PS5 Payload SDK
        uses: actions/checkout@v4
        with:
          repository: mihawk-99/PS5_PayloadSDK
          path: PS5_PayloadSDK
          fetch-depth: 0

      - name: Checkout PS5 LLVM
        uses: actions/checkout@v4
        with:
          repository: mihawk-99/PS5_LLVM
          path: PS5_LLVM
          fetch-depth: 1

      - name: Checkout PS5 OpenGL SDK
        uses: actions/checkout@v4
        with:
          repository: ownproxdedi/ps5-opengl
          path: ps5-opengl-sdk
          fetch-depth: 0

      - name: Verify LLVM licence
        shell: bash
        run: |
          set -euo pipefail

          LLVM_LICENSE="$GITHUB_WORKSPACE/PS5_LLVM/llvm/LICENSE.TXT"

          if [[ ! -s "$LLVM_LICENSE" ]]; then
            echo "::error::LLVM licence missing: $LLVM_LICENSE"
            exit 1
          fi

          echo "LLVM licence verified."

      # --------------------------------------------------
      # 3. Download prebuilt SDK and Vulkan bundle
      # --------------------------------------------------

      - name: Download prebuilt SDK and Vulkan bundle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh release download sdk-bundle-v1 \
            -R "$GITHUB_REPOSITORY" \
            -p "ps5vk-opengl-bundle.tar.gz" \
            -D "$GITHUB_WORKSPACE"

          tar -xzf "$GITHUB_WORKSPACE/ps5vk-opengl-bundle.tar.gz" \
            -C "$GITHUB_WORKSPACE"

          echo "Bundle extracted."

      # --------------------------------------------------
      # 4. Fetch RetroArch dependencies and sources
      # --------------------------------------------------

      - name: Fetch RetroArch dependencies and sources
        working-directory: PS5_RetroArch
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .deps/native

          if [[ -d "$GITHUB_WORKSPACE/PS5_Vulkan/.deps/native/zlib" ]]; then
            cp -a "$GITHUB_WORKSPACE/PS5_Vulkan/.deps/native/zlib" \
              .deps/native/zlib
          fi

          make deps

          rm -rf vendor/retroarch

          sed -i \
            's|libretro-common/include/retroarch.h|retroarch.h|g' \
            tools/fetch-retroarch.sh

          export PS5_PAYLOAD_SDK="$PWD/.deps/native/ps5-payload-sdk"
          export PS5_CLANG=/usr/bin/clang

          test -x "$PS5_PAYLOAD_SDK/bin/prospero-clang"

          bash tools/fetch-retroarch.sh

          mkdir -p \
            "$PS5_PAYLOAD_SDK/target/include" \
            "$PS5_PAYLOAD_SDK/target/lib"

          cp -r /usr/include/vulkan /usr/include/vk_video \
            "$PS5_PAYLOAD_SDK/target/include/" 2>/dev/null || true

          echo "void vkCreateInstance(void) {}" > /tmp/vk_stub.c

          "$PS5_PAYLOAD_SDK/bin/prospero-clang" \
            -c /tmp/vk_stub.c -o /tmp/vk_stub.o

          "$PS5_PAYLOAD_SDK/bin/llvm-ar" rcs \
            "$PS5_PAYLOAD_SDK/target/lib/libvulkan.a" \
            /tmp/vk_stub.o

      # --------------------------------------------------
      # 5. Prepare and build PSBC compiler
      # --------------------------------------------------

      - name: Prepare and build PSBC compiler
        working-directory: PS5_Vulkan
        shell: bash
        env:
          PS5_OPENGL_SDK: ${{ github.workspace }}/ps5-opengl-sdk
          PS5_MESA_DIR: ${{ github.workspace }}/PS5_Mesa
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Preparing PS5 PSBC compiler"
          echo "=========================================="

          SDK_SOURCE="$GITHUB_WORKSPACE/ps5-opengl-sdk"
          PAYLOAD_SOURCE="$GITHUB_WORKSPACE/PS5_RetroArch/.deps/native/ps5-payload-sdk"

          test -d "$SDK_SOURCE"
          test -x "$PAYLOAD_SOURCE/bin/prospero-clang"

          # The PS5 Vulkan compiler script expects its own
          # copy of the Payload SDK.
          mkdir -p .deps/native

          rm -rf .deps/native/ps5-payload-sdk

          cp -a "$PAYLOAD_SOURCE" \
            .deps/native/ps5-payload-sdk

          export PS5_OPENGL_SDK="$SDK_SOURCE"

          echo "SDK source: $PS5_OPENGL_SDK"

          # Fetch the SDK's pinned source dependencies.
          make -C "$SDK_SOURCE" source-fetch

          # ------------------------------------------------
          # Patch PSBC build script to generate Mesa headers
          # ------------------------------------------------

          python3 - <<'PY'
          from pathlib import Path

          script = Path("tools/build-psbc-ps5.sh")
          source = script.read_text()

          marker = (
              "support_objects=(../../src/platform/"
              "ps5_agc_package.ps5.o"
          )

          if marker not in source:
              raise SystemExit(
                  "Could not find PSBC support_objects insertion point. "
                  "The upstream build script may have changed."
              )

          injection = r'''
          # ------------------------------------------------
          # Generate required Mesa headers.
          # These must be generated inside the actual PSBC
          # compiler work tree, after its source has been copied.
          # ------------------------------------------------

          echo "Generating Mesa compiler headers..."

          FORMAT_DIR="$tree/src/util/format"
          COMPILER_DIR="$tree/src/compiler"
          UTIL_DIR="$tree/src/util"

          # Check all generator inputs before running them.
          test -s "$FORMAT_DIR/u_format_table.py"
          test -s "$FORMAT_DIR/u_format.yaml"

          test -s "$UTIL_DIR/process_shader_stats.py"
          test -s "$UTIL_DIR/shader_stats.rnc"
          test -s "$UTIL_DIR/shader_stats.xml"

          test -s "$COMPILER_DIR/builtin_types_h.py"
          test -s "$COMPILER_DIR/builtin_types.py"

          # 1. Mesa format enums.
          echo "Generating u_format_gen.h..."

          python3 "$FORMAT_DIR/u_format_table.py" \
              "$FORMAT_DIR/u_format.yaml" \
              --enums > "$FORMAT_DIR/u_format_gen.h"

          test -s "$FORMAT_DIR/u_format_gen.h"

          # 2. Mesa shader statistics header.
          echo "Generating shader_stats.h..."

          python3 "$UTIL_DIR/process_shader_stats.py" \
              "$UTIL_DIR/shader_stats.rnc" \
              "$UTIL_DIR/shader_stats.xml" \
              > "$UTIL_DIR/shader_stats.h"

          test -s "$UTIL_DIR/shader_stats.h"

          # 3. GLSL built-in type declarations.
          echo "Generating builtin_types.h..."

          python3 "$COMPILER_DIR/builtin_types_h.py" \
              "$COMPILER_DIR/builtin_types.h"

          test -s "$COMPILER_DIR/builtin_types.h"

          echo "Generated Mesa headers:"
          ls -lh \
              "$FORMAT_DIR/u_format_gen.h" \
              "$UTIL_DIR/shader_stats.h" \
              "$COMPILER_DIR/builtin_types.h"

          # Fail early if any expected header is missing.
          test -s "$UTIL_DIR/shader_stats.h"
          test -s "$COMPILER_DIR/builtin_types.h"
          test -s "$FORMAT_DIR/u_format_gen.h"

          '''

          if "Generating Mesa compiler headers" not in source:
              source = source.replace(
                  marker,
                  injection + "\n" + marker,
                  1
              )
              script.write_text(source)

          print("PSBC build script patched successfully.")
          PY

          # ------------------------------------------------
          # Build PSBC
          # ------------------------------------------------

          echo "=========================================="
          echo "Building PS5 PSBC compiler"
          echo "=========================================="

          if ! bash tools/build-psbc-ps5.sh; then
            echo ""
            echo "=========================================="
            echo "PSBC BUILD FAILED"
            echo "=========================================="

            LOG=".deps/work/psbc-ps5/build.log"

            if [[ -f "$LOG" ]]; then
              echo "Last 250 lines of PSBC build log:"
              tail -n 250 "$LOG"
            fi

            echo ""
            echo "Generated header diagnostics:"

            find .deps/work/psbc-ps5/third_party/opengnm-psbc/src \
              -type f \
              \( -name "u_format_gen.h" \
              -o -name "shader_stats.h" \
              -o -name "builtin_types.h" \) \
              -print 2>/dev/null || true

            exit 1
          fi

          echo "PSBC compiler built successfully."

      # --------------------------------------------------
      # 6. Adapt OpenGL SDK and fetch Mesa
      # --------------------------------------------------

      - name: Adapt OpenGL SDK and fetch Mesa
        working-directory: PS5_Vulkan
        shell: bash
        env:
          PS5_OPENGL_SDK: ${{ github.workspace }}/ps5-opengl-sdk
        run: |
          set -euo pipefail

          SDK_SOURCE="$GITHUB_WORKSPACE/ps5-opengl-sdk"

          echo "Adapting PS5 OpenGL SDK..."

          bash tools/adapt-opengl-sdk.sh "$SDK_SOURCE"

          echo "Fetching pinned Mesa source..."

          bash tools/fetch-mesa.sh

          LICENSE_FILE=".deps/native/mesa/mesa-26.2.0/docs/license.rst"

          if [[ ! -s "$LICENSE_FILE" ]]; then
            echo "::error::Mesa licence file is missing."
            exit 1
          fi

          echo "Mesa licence verified:"
          ls -lh "$LICENSE_FILE"

      # --------------------------------------------------
      # 7. Build PS5 RetroArch title
      # --------------------------------------------------

      - name: Build PS5 RetroArch title (mGBA test)
        working-directory: PS5_RetroArch
        shell: bash

        env:
          PS5_VULKAN_DIR: ${{ github.workspace }}/PS5_Vulkan
          PS5_FRAMEGEN: ${{ github.workspace }}/PS5_MihawkGen
          PS5_VULKAN_DRIVER: ps5vk
          PS5_CLANG: /usr/bin/clang

        run: |
          set -euo pipefail

          export PS5_PAYLOAD_SDK="$PWD/.deps/native/ps5-payload-sdk"
          export PATH="$PS5_PAYLOAD_SDK/bin:$PS5_PAYLOAD_SDK/target/bin:$PATH"

          LLD="$PS5_PAYLOAD_SDK/bin/prospero-lld"

          # ------------------------------------------------
          # Custom pthread linker wrapper
          # ------------------------------------------------

          if [[ -f "$LLD" ]] && ! grep -q "wrap=pthread_create" "$LLD"; then
            mv "$LLD" "${LLD}.orig"

            cat << 'EOF' > "$LLD"
          #!/usr/bin/env bash
          case " $* " in
            *"libps5platform"*)
              exec "${0}.orig" \
                --wrap=pthread_create \
                --wrap=pthread_join \
                --wrap=pthread_detach "$@"
              ;;
            *)
              exec "${0}.orig" "$@"
              ;;
          esac
          EOF

            chmod +x "$LLD"
          fi

          # ------------------------------------------------
          # Skip Lapy daemon
          # ------------------------------------------------

          printf '#!/usr/bin/env python3\nimport sys; sys.exit(0)\n' \
            > tools/build-lapy.py

          sed -i '/lapy-root-daemon/d' \
            tools/build-title.sh Makefile 2>/dev/null || true

          # ------------------------------------------------
          # Existing core compatibility patch
          # ------------------------------------------------

          python3 - <<'PY'
          import pathlib
          import re

          p = pathlib.Path("tools/check-core.py")
          txt = p.read_text()

          if "__setitem__(7, 9)" not in txt:
              def add_fix(m):
                  return m.group(0) + (
                      "    b = bytearray(path.read_bytes())\n"
                      "    if len(b) > 8 and b[7] == 0:\n"
                      "        b[7] = 9\n"
                      "        path.write_bytes(b)\n"
                  )

              txt, count = re.subn(
                  r"def inspect\([^)]*\):\n",
                  add_fix,
                  txt,
                  count=1
              )

              if count != 1:
                  raise SystemExit(
                      "Could not patch check-core.py"
                  )

              p.write_text(txt)

          assert "__setitem__(7, 9)" in p.read_text() or "b[7] = 9" in p.read_text()
          PY

          # ------------------------------------------------
          # Build mGBA only
          # ------------------------------------------------

          python3 - <<'PY'
          import pathlib

          bt = pathlib.Path("tools/build-title.sh")
          txt = bt.read_text()

          start = txt.index("core_names=(")
          end = txt.index(")", start) + 1

          bt.write_text(
              txt[:start] + "core_names=(mgba)" + txt[end:]
          )

          assert "core_names=(mgba)" in bt.read_text()

          # Handle missing Stella source in metadata generation.
          gm = pathlib.Path("tools/generate-core-metadata.py")
          gm_txt = gm.read_text()

          old = "data = stella_data(source)"
          new = "if not source.exists(): continue\n        data = stella_data(source)"

          if old in gm_txt:
              gm.write_text(gm_txt.replace(old, new, 1))
          PY

          # ------------------------------------------------
          # Build with diagnostics
          # ------------------------------------------------

          echo "=========================================="
          echo "Starting PS5 RetroArch mGBA build"
          echo "=========================================="

          if ! bash -x tools/build-title.sh 2>&1 | tee build-title.log; then

            echo ""
            echo "=========================================="
            echo "BUILD FAILED"
            echo "=========================================="

            echo ""
            echo "=== Last 200 lines of build output ==="
            tail -n 200 build-title.log

            echo ""
            echo "=== Dynamic exports in build ELF ==="

            while IFS= read -r -d '' f; do
              echo "--- $f ---"
              readelf -sW --dyn-syms "$f" 2>/dev/null \
                | grep -v " UND " || true
            done < <(
              find build -maxdepth 3 -type f \
                \( -name "*.elf" -o -name "eboot*" \) \
                -print0 2>/dev/null
            )

            echo ""
            echo "=== Linker map diagnostics ==="

            if [[ -f build/title.map ]]; then
              tail -n 150 build/title.map
            else
              echo "No linker map generated."
            fi

            echo ""
            echo "=== Build script ==="
            cat tools/build.sh

            echo ""
            echo "=== End diagnostics ==="

            exit 1
          fi

          # ------------------------------------------------
          # Verify output
          # ------------------------------------------------

          if [[ ! -s dist/PPSA99169/eboot.bin ]]; then
            echo "::error::eboot.bin missing!"
            exit 1
          fi

          echo "RetroArch title (mGBA test) built successfully."

      # --------------------------------------------------
      # 8. Package PS5 title
      # --------------------------------------------------

      - name: Package PPSA99169
        working-directory: PS5_RetroArch/dist
        shell: bash
        run: |
          set -euo pipefail

          test -d PPSA99169
          test -s PPSA99169/eboot.bin

          zip -qr \
            "$GITHUB_WORKSPACE/PPSA99169-ps5vk.zip" \
            PPSA99169

          sha256sum \
            "$GITHUB_WORKSPACE/PPSA99169-ps5vk.zip" \
            > "$GITHUB_WORKSPACE/PPSA99169-ps5vk.zip.sha256"

          ls -lh "$GITHUB_WORKSPACE/PPSA99169-ps5vk.zip"

      # --------------------------------------------------
      # 9. Upload compiled PS5 package
      # --------------------------------------------------

      - name: Upload compiled PS5 package
        uses: actions/upload-artifact@v4
        with:
          name: PPSA99169-ps5vk
          path: |
            PPSA99169-ps5vk.zip
            PPSA99169-ps5vk.zip.sha256
          if-no-files-found: error
          retention-days: 14
