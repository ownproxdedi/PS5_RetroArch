name: Build PS5 RetroArch Full

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:

      # --------------------------------------------------
      # 1. Install host dependencies
      # --------------------------------------------------

      - name: Install host build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get \
            -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=60 \
            update

          sudo apt-get install -y \
            ccache \
            build-essential \
            clang clang-18 \
            llvm llvm-18 llvm-18-dev \
            lld lld-18 \
            libclang-18-dev \
            libclang-cpp18-dev \
            libclc-18-dev \
            libllvmspirvlib-18-dev \
            cmake meson ninja-build \
            pkg-config binutils \
            git curl wget patch rsync \
            python3 python3-venv python3-pil \
            python3-mako python3-yaml python3-markupsafe \
            zip unzip tar xz-utils \
            glslang-tools spirv-headers \
            libvulkan-dev \
            vulkan-utility-libraries-dev \
            libfontconfig1-dev libx11-dev

      # --------------------------------------------------
      # 2. Checkout repositories
      # --------------------------------------------------

      - name: Checkout PS5 RetroArch
        uses: actions/checkout@v4
        with:
          path: PS5_RetroArch
          fetch-depth: 1

      - name: Checkout YOUR PS5 Vulkan repository
        uses: actions/checkout@v4
        with:
          repository: ownproxdedi/PS5_Vulkan
          ref: main
          path: PS5_Vulkan
          fetch-depth: 1

      - name: Checkout PS5 Mesa
        uses: actions/checkout@v4
        with:
          repository: mihawk-99/PS5_Mesa
          ref: main
          path: PS5_Mesa
          fetch-depth: 1

      - name: Checkout PS5 Payload SDK
        uses: actions/checkout@v4
        with:
          repository: mihawk-99/PS5_PayloadSDK
          ref: main
          path: PS5_PayloadSDK
          fetch-depth: 0

      - name: Checkout PS5 MihawkGen
        uses: actions/checkout@v4
        with:
          repository: mihawk-99/PS5_MihawkGen
          ref: main
          path: PS5_MihawkGen
          fetch-depth: 1

      - name: Checkout PS5 LLVM
        uses: actions/checkout@v4
        with:
          repository: mihawk-99/PS5_LLVM
          ref: main
          path: PS5_LLVM
          fetch-depth: 1

      - name: Checkout prospero-win (for Lapy ps5log)
        uses: actions/checkout@v4
        with:
          repository: mpereiraesaa/prospero-win
          ref: main
          path: prospero-win-main
          fetch-depth: 0
          
      - name: Checkout PS5-Lapy-JB-Daemon
        uses: actions/checkout@v4
        with:
          repository: mpereiraesaa/PS5-Lapy-JB-Daemon
          ref: main
          path: PS5-Lapy-JB-Daemon
          fetch-depth: 0


      # --------------------------------------------------
      # 3. Verify LLVM licence
      # --------------------------------------------------

      - name: Verify LLVM licence
        shell: bash
        run: |
          set -euo pipefail

          LLVM_LICENSE="$GITHUB_WORKSPACE/PS5_LLVM/llvm/LICENSE.TXT"

          if [[ ! -s "$LLVM_LICENSE" ]]; then
            echo "::error::LLVM licence is missing"
            exit 1
          fi

          echo "LLVM licence verified."

      # --------------------------------------------------
      # 4. Install Meson
      # --------------------------------------------------

      - name: Install Meson and Python build dependencies
        shell: bash
        run: |
          set -euo pipefail

          python3 -m venv "$HOME/.venvs/meson"

          "$HOME/.venvs/meson/bin/pip" install --upgrade pip
          "$HOME/.venvs/meson/bin/pip" install \
            "meson>=1.4.0" \
            packaging \
            mako \
            PyYAML \
            Pillow

          echo "$HOME/.venvs/meson/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.venvs/meson/bin:$PATH"

          python3 -c "import packaging, mako, yaml, PIL; print('Python dependencies OK')"
          meson --version
          
      # --------------------------------------------------
      # 5. Cache & Build RADV
      # --------------------------------------------------

      - name: Restore RADV release archive from cache
        id: restore-radv
        uses: actions/cache/restore@v4
        with:
          path: |
            PS5_Vulkan/.deps/native/radv-release
            PS5_Vulkan/build
          key: radv-release-${{ runner.os }}-${{ hashFiles('PS5_Vulkan/.git/refs/heads/*', 'PS5_Mesa/.git/refs/heads/*', 'PS5_PayloadSDK/.git/refs/heads/*', 'PS5_LLVM/.git/HEAD') }}

      - name: Build RADV release archive
        if: steps.restore-radv.outputs.cache-hit != 'true'
        working-directory: PS5_Vulkan
        shell: bash
        env:
          PS5_PAYLOAD_SDK_FORK: ${{ github.workspace }}/PS5_PayloadSDK
          PS5_MESA_FORK: ${{ github.workspace }}/PS5_Mesa
        run: |
          set -euo pipefail

          # Shallow-fetch the exact Mesa revision pinned by build-radv.sh
          MESA_REV=$(grep -oE '[0-9a-f]{40}' tools/build-radv.sh | head -n 1)
          if [[ -n "${MESA_REV:-}" ]]; then
            git -C "$PS5_MESA_FORK" fetch --depth=1 origin "$MESA_REV"
          fi

          echo "=========================================="
          echo "Preparing PS5 Vulkan dependencies"
          echo "=========================================="

          bash tools/setup-native-dependencies.sh

          echo "=========================================="
          echo "Building Mesa RADV for PS5"
          echo "=========================================="

          bash tools/build-radv.sh release

      - name: Save RADV release archive to cache
        if: steps.restore-radv.outputs.cache-hit != 'true' && hashFiles('PS5_Vulkan/.deps/native/radv-release/lib/libvulkan_radeon.ps5.a') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            PS5_Vulkan/.deps/native/radv-release
            PS5_Vulkan/build
          key: ${{ steps.restore-radv.outputs.cache-primary-key }}

      - name: Verify RADV release archive
        working-directory: PS5_Vulkan
        shell: bash
        run: |
          set -euo pipefail

          RADV_ARCHIVE=".deps/native/radv-release/lib/libvulkan_radeon.ps5.a"

          if [[ ! -s "$RADV_ARCHIVE" ]]; then
            echo "::error::RADV archive was not generated or restored"
            exit 1
          fi

          if [[ ! -s ".deps/native/radv-release/PROVENANCE.txt" ]]; then
            echo "::error::RADV provenance file is missing"
            exit 1
          fi

          echo "RADV ready:"
          ls -lh "$RADV_ARCHIVE"
          cat ".deps/native/radv-release/PROVENANCE.txt"

      # --------------------------------------------------
      # Restore ccache for fast core rebuilds
      # --------------------------------------------------

      - name: Restore ccache
        id: restore-ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-


      # --------------------------------------------------
      # 6. Prepare RetroArch dependencies
      # --------------------------------------------------

      - name: Fetch RetroArch dependencies and sources
        working-directory: PS5_RetroArch
        shell: bash
        env:
          PS5_PAYLOAD_SDK_FORK: ${{ github.workspace }}/PS5_PayloadSDK
        run: |
          set -euo pipefail

          echo "Preparing RetroArch dependencies..."
          make deps

          echo "Fixing RetroArch header check path in fetch-retroarch.sh..."
          sed -i 's|libretro-common/include/retroarch.h|retroarch.h|g' tools/fetch-retroarch.sh

          echo "Fetching pinned RetroArch source..."
          rm -rf vendor/retroarch
          bash tools/fetch-retroarch.sh

          if [[ ! -s vendor/retroarch/assets/sounds/README.md ]]; then
            mkdir -p vendor/retroarch/assets/sounds
            curl -fsSL https://githubusercontent.com \
              -o vendor/retroarch/assets/sounds/README.md || \
              echo "RetroArch audio assets (CC-BY-4.0 / public domain)." > vendor/retroarch/assets/sounds/README.md
          fi


      # --------------------------------------------------
      # 7. Configure RADV full-core build
      # --------------------------------------------------

      - name: Configure RADV full-core build
        working-directory: PS5_RetroArch
        shell: bash
        run: |
          set -euo pipefail

          # 1. Tag every built *_libretro.so with FreeBSD OS/ABI (0x09) inside check-core.py.
          python3 -c '
          from pathlib import Path
          import sys

          cc = Path("tools/check-core.py")
          text = cc.read_text()
          target = "def inspect(path):"
          replacement = (
              "def inspect(path):\n"
              "    subprocess.run([\"elfedit\", \"--output-osabi\", \"FreeBSD\", str(path)], check=False)\n"
          )
          if target not in text:
              sys.exit("Could not locate def inspect(path): in tools/check-core.py")
          cc.write_text(text.replace(target, replacement, 1))
          print("Configured automatic FreeBSD OS/ABI tagging in tools/check-core.py.")
          '

          # 2. Align prospero-win-main commit or LOG_SHA in tools/build-lapy.py.
          python3 -c '
          import hashlib, re, subprocess
          from pathlib import Path
          lapy = Path("tools/build-lapy.py")
          lapy_text = lapy.read_text()
          m = re.search(r"LOG_SHA\s*=\s*[\"\x27]([0-9a-f]{64})[\"\x27]", lapy_text)
          prospero_dir = Path("../prospero-win-main")
          ps5log_h = prospero_dir / "native/ps5log/ps5log.h"
          if m and ps5log_h.is_file():
              target_sha = m.group(1)
              matched_rev = None
              revs = subprocess.check_output(["git", "-C", str(prospero_dir), "rev-list", "HEAD"], text=True).splitlines()
              for rev in revs:
                  try:
                      blob = subprocess.check_output(["git", "-C", str(prospero_dir), "show", f"{rev}:native/ps5log/ps5log.h"], stderr=subprocess.DEVNULL)
                  except subprocess.CalledProcessError:
                      continue
                  if hashlib.sha256(blob).hexdigest() == target_sha:
                      matched_rev = rev
                      break
              if matched_rev:
                  subprocess.run(["git", "-C", str(prospero_dir), "checkout", "-q", matched_rev], check=True)
                  print(f"Checked out matching prospero-win commit {matched_rev[:12]} for Lapy.")
              else:
                  actual_sha = hashlib.sha256(ps5log_h.read_bytes()).hexdigest()
                  lapy.write_text(lapy_text.replace(target_sha, actual_sha, 1))
                  print(f"Updated LOG_SHA in build-lapy.py to {actual_sha[:12]}.")
          '
          
          # 3. Remove mame from core_names and skip its metadata generation.
          python3 -c '
          from pathlib import Path
          import re, sys

          build = Path("tools/build-title.sh")
          text = build.read_text()
          new_text, count = re.subn(
              r"(core_names=\([^)]*?)\bmame\b\s*",
              r"\1",
              text,
              count=1,
          )
          if not count:
              sys.exit("Could not locate mame inside core_names=(...) in tools/build-title.sh")
          build.write_text(new_text)
          print("Removed mame from tools/build-title.sh.")

          metadata = Path("tools/generate-core-metadata.py")
          meta_text = metadata.read_text()
          old = "        data = stella_data(source) if stem == '\''stella'\'' else compile_tables(stem, source, flags, helper)"
          new = (
              "        if stem == '\''mame'\'' and not source.is_file():\n"
              "            continue\n"
              + old
          )
          if old not in meta_text:
              sys.exit("Could not locate metadata generation line in tools/generate-core-metadata.py")
          metadata.write_text(meta_text.replace(old, new, 1))
          print("Configured metadata skip for mame.")
          '

          # 4. Ensure assets/sounds/README.md exists for tools/stage-notices.py.
          python3 -c '
          from pathlib import Path
          import urllib.request

          url = "https://githubusercontent.com"
          try:
              content = urllib.request.urlopen(url, timeout=15).read().decode("utf-8", "replace")
          except Exception:
              content = "RetroArch audio assets (CC-BY-4.0 / public domain).\n"

          for rel in ("vendor/retroarch/assets/sounds/README.md", "assets/sounds/README.md"):
              p = Path(rel)
              p.parent.mkdir(parents=True, exist_ok=True)
              if not p.is_file() or p.stat().st_size == 0:
                  p.write_text(content)
          print("Staged assets/sounds/README.md for stage-notices.py.")
          '

      
      - name: Save ccache
        if: always() && hashFiles('~/.ccache') != ''
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ${{ steps.restore-ccache.outputs.cache-primary-key }}
          
      # --------------------------------------------------
      # 8. Build RetroArch using RADV
      # --------------------------------------------------

      - name: Build PS5 RetroArch with RADV
        working-directory: PS5_RetroArch
        shell: bash
        env:
          PS5_VULKAN_DIR: ${{ github.workspace }}/PS5_Vulkan
          PS5_VULKAN_DRIVER: radv
          PS5_FRAMEGEN: ${{ github.workspace }}/PS5_MihawkGen
          PS5_PAYLOAD_SDK_FORK: ${{ github.workspace }}/PS5_PayloadSDK
          PS5_CLANG: /usr/bin/clang
          core_ccache: ccache
          CCACHE_MAXSIZE: 4G
        run: |
          set -euo pipefail

          export PS5_PAYLOAD_SDK="$PWD/.deps/native/ps5-payload-sdk"
          export PATH="$PS5_PAYLOAD_SDK/bin:$PATH"

          # Route clang-18 through ccache (and keep -mvaes guard for AesOpt.c)
          bash tools/setup-native-dependencies.sh
          rm -f "$PS5_PAYLOAD_SDK/bin/clang"
          cat > "$PS5_PAYLOAD_SDK/bin/clang" <<'EOF'
          #!/usr/bin/env bash
          extra=()
          for arg in "$@"; do
            [[ "$arg" == *"AesOpt.c" ]] && extra=(-mvaes)
          done
          exec ccache /usr/bin/clang-18 "$@" "${extra[@]}"
          EOF
          chmod +x "$PS5_PAYLOAD_SDK/bin/clang"

          # Satisfy RetroArch ./configure's -lvulkan probe if not already staged by SDK
          if [[ ! -f "$PS5_PAYLOAD_SDK/target/lib/libvulkan.a" && ! -f "$PS5_PAYLOAD_SDK/target/lib/libvulkan.so" ]]; then
            mkdir -p build/radv-shim
            echo 'void vkCreateInstance(void) {}' | "$PS5_PAYLOAD_SDK/bin/prospero-clang" -x c -c - -o build/radv-shim/vk_stub.o
            "$PS5_PAYLOAD_SDK/bin/prospero-ar" rcs "$PS5_PAYLOAD_SDK/target/lib/libvulkan.a" build/radv-shim/vk_stub.o
          fi

          echo "=========================================="
          echo "Starting PS5 RetroArch RADV build"
          echo "=========================================="
          echo "PS5_PAYLOAD_SDK: $PS5_PAYLOAD_SDK"
          echo "Selected Vulkan driver: $PS5_VULKAN_DRIVER"

          RADV_ARCHIVE="$PS5_VULKAN_DIR/.deps/native/radv-release/lib/libvulkan_radeon.ps5.a"

          if [[ ! -s "$RADV_ARCHIVE" ]]; then
            echo "::error::RADV archive is missing: $RADV_ARCHIVE"
            exit 1
          fi

          bash -x tools/build-title.sh 2>&1 | tee build-title.log

          if [[ ! -s dist/PPSA99169/eboot.bin ]]; then
            echo "::error::PS5 eboot.bin was not generated"
            exit 1
          fi

          echo "=========================================="
          echo "RetroArch RADV build completed"
          echo "=========================================="

          ls -lh dist/PPSA99169/eboot.bin
          ls -1 dist/PPSA99169/cores/ | wc -l

      # --------------------------------------------------
      # 9. Failure diagnostics
      # --------------------------------------------------

      - name: Diagnose build failure
        if: failure()
        run: |
          if [ -f "PS5_RetroArch/build/ra-conf/configure.log" ]; then
            echo "=========================================="
            echo "RetroArch configure.log (last 100 lines)"
            echo "=========================================="
            tail -n 100 PS5_RetroArch/build/ra-conf/configure.log
          fi

          if [ -f "PS5_RetroArch/build-title.log" ]; then
            echo "=========================================="
            echo "Compiler/Linker errors in build-title.log"
            echo "=========================================="
            grep -n -C 5 "error:" PS5_RetroArch/build-title.log | tail -n 80 || true
          fi


      # --------------------------------------------------
      # 10. Package title
      # --------------------------------------------------

      - name: Package PPSA99169 RADV
        working-directory: PS5_RetroArch/dist
        shell: bash
        run: |
          set -euo pipefail

          test -d PPSA99169
          test -s PPSA99169/eboot.bin

          zip -qr "$GITHUB_WORKSPACE/PPSA99169-radv.zip" PPSA99169
          sha256sum "$GITHUB_WORKSPACE/PPSA99169-radv.zip" > "$GITHUB_WORKSPACE/PPSA99169-radv.zip.sha256"

          echo "Package created:"
          ls -lh "$GITHUB_WORKSPACE/PPSA99169-radv.zip"

      # --------------------------------------------------
      # 11. Upload artifact
      # --------------------------------------------------
      - name: Upload PS5 RetroArch RADV package
        uses: actions/upload-artifact@v4
        with:
          name: PPSA99169-radv
          path: PS5_RetroArch/dist/PPSA99169
          if-no-files-found: error
          retention-days: 14


      # --------------------------------------------------
      # 12. Publish GitHub Release
      # --------------------------------------------------

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: radv-${{ github.run_number }}
          name: PS5 RetroArch RADV (Build #${{ github.run_number }})
          body: |
            Automated RADV build of PS5 RetroArch (`PPSA99169`) with all 33 native cores.

            - **Commit:** `${{ github.sha }}`
            - **Vulkan Driver:** Mesa RADV (`ownproxdedi/PS5_Vulkan`)
          files: |
            PPSA99169-radv.zip
            PPSA99169-radv.zip.sha256
          draft: false
          prerelease: true

